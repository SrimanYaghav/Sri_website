<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./assets/icon.png" />
    <title>Sriman Yaghav</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="media.css" />
    <link rel="stylesheet" href="landing.css" />
  </head>
  <body>
    <canvas id="bg-canvas"></canvas>

    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
      <span class="icon-sun">☀️</span>
      <span class="icon-moon">🌙</span>
    </button>

    <section id="landing">
      <div class="section__pic-container">
        <img src="./assets/pro.png" alt="profile picture" />
      </div>
      <div class="section__text">
        <p class="section__text__p1">Hello, I'm</p>
        <h1 class="title">Sriman Yaghav</h1>
        <p class="section__text__p2">Software Developer &amp; 3D Artist</p>

        <div class="landing-details-container">
          <img src="./assets/education.png" alt="Education icon" class="icon" />
          <h3>Education</h3>
          <p>
            B.E. Computer Science Engineering 2022 - 2025 <br />
            Electrical And Electronics Engineering (Polytechnic)
          </p>
        </div>

        <p class="section__text__p1 choose-text">Choose what you'd like to see</p>
        <div class="btn-container">
          <button
            class="btn btn-color-1"
            onclick="location.href='software-developer.html'"
          >
            Software Developer
          </button>
          <button
            class="btn btn-color-1"
            onclick="location.href='3d-animation.html'"
          >
            3D &amp; Animation
          </button>
        </div>

        <div id="socials-container">
          <img
            src="./assets/linkedin.png"
            alt="My LinkedIn profile"
            class="icon"
            onclick="location.href='https://linkedin.com/in/SrimanYaghav'"
          />
          <img
            src="./assets/github.png"
            alt="My Github profile"
            class="icon"
            onclick="location.href='https://github.com/SrimanYaghav'"
          />
        </div>
      </div>
    </section>
    <footer>
      <p>Copyright &#169; 2023 Sriman Yaghav Portfolio. All Rights Reserved.</p>
    </footer>

    <script src="background.js"></script>
    <script src="script.js"></script>
  </body>
</html>
